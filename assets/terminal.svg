<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="300" viewBox="0 0 1080 300" role="img" aria-label="Terminal session">
  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,monospace; font-size: 16px; }
    .ttl  { font-family: 'JetBrains Mono','Fira Code',monospace; font-size: 13px; fill: #6e7681; }
    .b    { fill: #c9d1d9; }
    .g    { fill: #3fb950; }
    .mut  { fill: #8b949e; }
    .acc  { fill: #58a6ff; }
    .name { fill: #e6edf3; font-weight: 600; }
  </style>

  <!-- window -->
  <rect x="1" y="1" width="1078" height="298" rx="12" fill="#0d1117" stroke="#30363d"/>
  <!-- title bar -->
  <rect x="1" y="1" width="1078" height="46" rx="12" fill="#161b22"/>
  <rect x="1" y="35" width="1078" height="12" fill="#161b22"/>
  <line x1="1" y1="47" x2="1079" y2="47" stroke="#30363d"/>
  <circle cx="28" cy="24" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="24" r="6" fill="#febc2e"/>
  <circle cx="72" cy="24" r="6" fill="#27c93f"/>
  <text x="540" y="29" text-anchor="middle" class="ttl">krishna@portfolio — zsh</text>

  <!-- typewriter clips -->
  <defs>
    <clipPath id="l1"><rect x="20" y="76"  height="28" width="0"><animate attributeName="width" values="0;1056" begin="0.3s" dur="0.40s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect x="20" y="106" height="28" width="0"><animate attributeName="width" values="0;1056" begin="1.0s" dur="0.85s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="20" y="136" height="28" width="0"><animate attributeName="width" values="0;1056" begin="2.0s" dur="0.45s" fill="freeze"/></rect></clipPath>
    <clipPath id="l4"><rect x="20" y="166" height="28" width="0"><animate attributeName="width" values="0;1056" begin="2.6s" dur="0.55s" fill="freeze"/></rect></clipPath>
    <clipPath id="l5"><rect x="20" y="196" height="28" width="0"><animate attributeName="width" values="0;1056" begin="3.4s" dur="0.50s" fill="freeze"/></rect></clipPath>
    <clipPath id="l6"><rect x="20" y="226" height="28" width="0"><animate attributeName="width" values="0;1056" begin="4.1s" dur="0.85s" fill="freeze"/></rect></clipPath>
    <clipPath id="l7"><rect x="20" y="256" height="28" width="0"><animate attributeName="width" values="0;1056" begin="5.1s" dur="0.20s" fill="freeze"/></rect></clipPath>
  </defs>

  <g clip-path="url(#l1)"><text x="28" y="96"  class="mono b"><tspan class="g">$</tspan> whoami</text></g>
  <g clip-path="url(#l2)"><text x="28" y="126" class="mono"><tspan class="name">Krishna Kant Singh</tspan><tspan class="mut">  —  Forward Deployed Engineer &amp; UI/UX Architect</tspan></text></g>
  <g clip-path="url(#l3)"><text x="28" y="156" class="mono b"><tspan class="g">$</tspan> cat focus.txt</text></g>
  <g clip-path="url(#l4)"><text x="28" y="186" class="mono"><tspan class="acc">frontend</tspan><tspan class="mut"> · </tspan><tspan class="acc">backend</tspan><tspan class="mut"> · </tspan><tspan class="acc">applied AI</tspan></text></g>
  <g clip-path="url(#l5)"><text x="28" y="216" class="mono b"><tspan class="g">$</tspan> ls ~/projects</text></g>
  <g clip-path="url(#l6)"><text x="28" y="246" class="mono"><tspan class="acc">friday</tspan><tspan class="mut">   </tspan><tspan class="acc">krenk</tspan><tspan class="mut">   </tspan><tspan class="acc">snapyour.codes</tspan><tspan class="mut">   </tspan><tspan class="acc">lavio-ai</tspan><tspan class="mut">   </tspan><tspan class="acc">shopify-nextjs</tspan></text></g>
  <g clip-path="url(#l7)"><text x="28" y="276" class="mono b"><tspan class="g">$</tspan> </text></g>

  <!-- blinking cursor -->
  <rect x="46" y="263" width="11" height="17" fill="#c9d1d9" opacity="0">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.06s" begin="5.35s" repeatCount="indefinite"/>
  </rect>
</svg>
