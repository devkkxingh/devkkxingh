<svg xmlns="http://www.w3.org/2000/svg" width="780" height="250" viewBox="0 0 780 250" role="img" aria-label="Terminal session">
  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,monospace; font-size: 16px; }
    .ttl  { font-family: 'JetBrains Mono','Fira Code',monospace; font-size: 13px; fill: #6e7681; }
    .b    { fill: #c9d1d9; }
    .g    { fill: #3fb950; }
    .mut  { fill: #8b949e; }
    .acc  { fill: #58a6ff; }
    .name { fill: #e6edf3; font-weight: 600; }
  </style>

  <!-- window -->
  <rect x="1" y="1" width="778" height="248" rx="12" fill="#0d1117" stroke="#30363d"/>
  <!-- title bar -->
  <rect x="1" y="1" width="778" height="44" rx="12" fill="#161b22"/>
  <rect x="1" y="33" width="778" height="12" fill="#161b22"/>
  <line x1="1" y1="45" x2="779" y2="45" stroke="#30363d"/>
  <circle cx="28" cy="23" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="23" r="6" fill="#febc2e"/>
  <circle cx="72" cy="23" r="6" fill="#27c93f"/>
  <text x="390" y="28" text-anchor="middle" class="ttl">krishna@portfolio — zsh</text>

  <!-- typewriter clips -->
  <defs>
    <clipPath id="l1"><rect x="20" y="68"  height="28" width="0"><animate attributeName="width" values="0;760" begin="0.3s" dur="0.45s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect x="20" y="100" height="28" width="0"><animate attributeName="width" values="0;760" begin="1.1s" dur="0.85s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="20" y="132" height="28" width="0"><animate attributeName="width" values="0;760" begin="2.1s" dur="0.50s" fill="freeze"/></rect></clipPath>
    <clipPath id="l4"><rect x="20" y="164" height="28" width="0"><animate attributeName="width" values="0;760" begin="2.8s" dur="0.65s" fill="freeze"/></rect></clipPath>
    <clipPath id="l5"><rect x="20" y="196" height="28" width="0"><animate attributeName="width" values="0;760" begin="3.7s" dur="0.20s" fill="freeze"/></rect></clipPath>
  </defs>

  <g clip-path="url(#l1)"><text x="28" y="88"  class="mono b"><tspan class="g">$</tspan> whoami</text></g>
  <g clip-path="url(#l2)"><text x="28" y="120" class="mono"><tspan class="name">Krishna Kant Singh</tspan><tspan class="mut">  —  Senior Frontend Engineer</tspan></text></g>
  <g clip-path="url(#l3)"><text x="28" y="152" class="mono b"><tspan class="g">$</tspan> cat focus.txt</text></g>
  <g clip-path="url(#l4)"><text x="28" y="184" class="mono"><tspan class="acc">frontend</tspan><tspan class="mut"> · </tspan><tspan class="acc">backend</tspan><tspan class="mut"> · </tspan><tspan class="acc">applied AI</tspan></text></g>
  <g clip-path="url(#l5)"><text x="28" y="216" class="mono b"><tspan class="g">$</tspan> </text></g>

  <!-- blinking cursor -->
  <rect x="46" y="203" width="11" height="17" fill="#c9d1d9" opacity="0">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.06s" begin="3.95s" repeatCount="indefinite"/>
  </rect>
</svg>
